spring.application.name=abc_bank

server.port=8090

#MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

#JWT Configuration
# Must be a random secret of at least 256 bits (32+ chars) supplied via the environment.
jwt.secret.string=${JWT_SECRET}
# Token lifetime in ms (default 1 day).
jwt.expiration.time=${JWT_EXPIRATION_MS:86400000}

#CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

#Mail Configuration
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


spring.mail.host=smtp.gmail.com
spring.mail.port=587

#Enable TLS SMTP MAIL

spring.mail.properties.smtp.auth=true
spring.mail.properties.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
